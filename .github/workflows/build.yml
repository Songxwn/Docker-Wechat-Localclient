name: Build All Platforms

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.32.0"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter create --project-name wechat_selkies_client --platforms=android .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter create --project-name wechat_selkies_client --platforms=ios .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned .app
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: ios-unsigned.ipa

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter create --project-name wechat_selkies_client --platforms=web .
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter create --project-name wechat_selkies_client --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter create --project-name wechat_selkies_client --platforms=macos .
      - name: Bump macOS deployment target to 10.14
        run: |
          sed -i '' "s/platform :osx, '[0-9.]*'/platform :osx, '10.14'/" macos/Podfile || true
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]*/MACOSX_DEPLOYMENT_TARGET = 10.14/g' macos/Runner.xcodeproj/project.pbxproj || true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip .app
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../macos-app.zip *.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: macos-app.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter create --project-name wechat_selkies_client --platforms=linux .
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: linux-x64.tar.gz

  release:
    needs: [android, ios, web, windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release files
        run: |
          mkdir -p release
          # Android APK
          find artifacts/android-apk -name '*.apk' -exec cp {} release/WeChat-Selkies-android.apk \; || true
          # iOS unsigned
          cp artifacts/ios-unsigned/ios-unsigned.ipa release/WeChat-Selkies-ios-unsigned.ipa || true
          # macOS
          cp artifacts/macos-app/macos-app.zip release/WeChat-Selkies-macos.zip || true
          # Linux
          cp artifacts/linux-build/linux-x64.tar.gz release/WeChat-Selkies-linux-x64.tar.gz || true
          # Windows (zip the folder)
          cd artifacts/windows-build && zip -r ../../release/WeChat-Selkies-windows-x64.zip . && cd ../..
          # Web (zip)
          cd artifacts/web-build && zip -r ../../release/WeChat-Selkies-web.zip . && cd ../..
          ls -la release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
