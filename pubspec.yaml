name: wechat_selkies_client
description: WeChat Selkies 本地远程客户端 (Flutter 全平台版)
publish_to: "none"
version: 5.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  flutter_inappwebview: ^6.1.5
  # Windows 内置浏览器实现（WebView2），使 Windows 桌面端也用应用内浏览器
  flutter_inappwebview_windows: ^0.6.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
